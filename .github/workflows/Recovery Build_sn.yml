name: Build Bootable Boston Recovery (Moto G Stylus 5G 2024)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "Recovery manifest URL"
        required: true
        default: "https://github.com/PitchBlackRecoveryProject/manifest_pb.git"
      MANIFEST_BRANCH:
        description: "Recovery manifest branch"
        required: true
        default: "android-12.1"
      DEVICE_TREE_URL:
        description: "Boston device tree"
        required: true
        default: "https://github.com/PizzaG/android_device_motorola_boston.git"
      DEVICE_TREE_BRANCH:
        description: "Boston device-tree branch"
        required: true
        default: "TWRP"
      DEVICE_PATH:
        description: "Device tree path"
        required: true
        default: "device/motorola/boston"
      COMMON_TREE_URL:
        description: "Optional common tree URL; leave blank if not needed"
        required: false
        default: ""
      COMMON_PATH:
        description: "Optional common tree path"
        required: false
        default: "device/motorola/sm6450-common"
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "boston"
      MAKEFILE_NAME:
        description: "Known bootable device product target"
        required: true
        default: "twrp_boston"
      BUILD_JOBS:
        description: "Parallel build jobs"
        required: true
        type: choice
        options:
          - "2"
          - "4"
        default: "2"

permissions:
  contents: read

concurrency:
  group: boston-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ inputs.COMMON_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }}
      BUILD_JOBS: ${{ inputs.BUILD_JOBS }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop openjdk-11-jdk \
            pngcrush python3 rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"
          git config --global user.name "Boston Recovery Builder"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Sync source
        working-directory: workspace
        run: |
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4

      - name: Clone Boston device tree
        working-directory: workspace
        run: |
          mkdir -p "$(dirname "$DEVICE_PATH")"
          git clone --depth=1 --single-branch -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_PATH"

      - name: Clone optional common tree
        if: ${{ inputs.COMMON_TREE_URL != '' }}
        working-directory: workspace
        run: |
          test -n "$COMMON_PATH" || { echo "::error::COMMON_PATH is required."; exit 1; }
          mkdir -p "$(dirname "$COMMON_PATH")"
          git clone --depth=1 --single-branch "$COMMON_TREE_URL" "$COMMON_PATH"

      - name: Validate Boston device configuration
        working-directory: workspace
        run: |
          set -e
          test -f "$DEVICE_PATH/BoardConfig.mk" || { echo "::error::BoardConfig.mk missing."; exit 1; }
          test -f "$DEVICE_PATH/${MAKEFILE_NAME}.mk" || {
            echo "::error::${MAKEFILE_NAME}.mk missing; selected product is not present in this tree."
            exit 1
          }
          test -f build/envsetup.sh || { echo "::error::build/envsetup.sh missing."; exit 1; }
          echo "Device product: ${MAKEFILE_NAME}"
          if [ -f "$DEVICE_PATH/recovery/root/init.recovery.qcom.rc" ]; then
            echo "Found device recovery init file."
          else
            echo "::warning::recovery/root/init.recovery.qcom.rc is missing."
          fi
          if [ -f "$DEVICE_PATH/recovery/root/init.recovery.qcom_decrypt.rc" ]; then
            echo "Found Qualcomm recovery decrypt init file."
          else
            echo "::warning::recovery/root/init.recovery.qcom_decrypt.rc is missing."
          fi

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery image
        working-directory: workspace
        shell: bash
        run: |
          set -eo pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          # Avoid `set -u`: Android envsetup scripts can reference unset variables.
          source build/envsetup.sh
          lunch "${MAKEFILE_NAME}-eng"
          mka recoveryimage -j"${BUILD_JOBS}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify recovery image
        if: always()
        shell: bash
        run: |
          IMAGE="workspace/out/target/product/${DEVICE_NAME}/recovery.img"
          if [ -s "$IMAGE" ]; then
            ls -lh "$IMAGE"
            file "$IMAGE"
          else
            echo "::error::Recovery image missing or empty: $IMAGE"
            echo "Check build.log for the first actual error."
          fi

      - name: Upload recovery and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Boston-Recovery-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            workspace/out/target/product/boston/recovery.img
            workspace/out/target/product/boston/recovery.tar
            build.log
          retention-days: 7